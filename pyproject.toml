[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chacc-api"
version = "1.0.0-b5"
description = "ChaCC API - A modular FastAPI application for extensible APIs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Jonas G Mwambimbi", email = "jonasgeorge1015@gmail.com"}
]
keywords = ["api", "fastapi", "modular", "plugin", "chacc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "slowapi",
    "python-decouple",
    "pyjwt",
    "argon2-cffi",
    "python-multipart",
    "email-validator",
    "colorlog",
    "chacc-dependency-manager",
    "redis",
    "requests",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "uuid-utils",
    "aiosqlite"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
chacc = "chacc_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/chacc-io/chacc-api"
Documentation = "https://chacc-api.readthedocs.io"
Repository = "https://github.com/tnet-tech/chacc-api"
Issues = "https://github.com/tnet-tech/chacc-api/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "chacc_cli*",
    "chacc_api*",
    "src",
    "src.migration",
    "src.module_loader",
    "src.services",
]
exclude = ["tests*", "deployment*"]

[tool.setuptools.package-data]
chacc_cli = ["templates/*.template"]
chacc_api = [".env.sample", "assets/*", "server/static/css/*.css", "server/static/js/*.js", "server/static/img/*", "server/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "ASYNC230"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["build/", "plans/", "modules_installed/", "plugins/", "src/"]
ignore_missing_imports = true
