# ChaCC API - Docker Compose for Production
# 
# Usage:
#   Pull from Docker Hub: docker-compose up -d

version: '3.8'

services:
  chacc:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.local
    image: chacc-api:latest
    container_name: chacc-api
    ports:
      - "8085:8085"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chacc_modules:/app/.modules_installed
      - chacc_plugins:/app/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chacc-network

  db:
    image: postgres:16-alpine
    container_name: chacc-db
    environment:
      - POSTGRES_USER=chacc
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chacc}
      - POSTGRES_DB=chacc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chacc -d chacc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chacc-network
    expose:
      - "5432"

volumes:
  postgres_data:
    driver: local
  chacc_modules:
    driver: local
  chacc_plugins:
    driver: local

networks:
  chacc-network:
    driver: bridge
