name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Custom Docker tag to use (optional)'
        required: false
        default: ''

jobs:
  docker-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/chacc-api
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest
            type=match,pattern=v?(\\d+\\.\\d+\\.\\d+-(?:beta|rc)\\.\\d+),group=1
            type=match,pattern=v?(\\d+\\.\\d+-(?:beta|rc)\\.\\d+),group=1

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.local
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ inputs.docker_tag != '' && format('{0}/chacc-api:{1}', secrets.DOCKER_USERNAME, inputs.docker_tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64